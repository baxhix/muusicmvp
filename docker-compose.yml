# ──────────────────────────────────────────────────────────────────────────
# muusic — Docker Compose stack
#
# Designed for VPS environments where the HOST already has an nginx (or
# other reverse proxy) handling :80/:443 for other projects. All services
# bind to 127.0.0.1 only — public traffic is brokered by host nginx.
#
# Ports chosen to avoid collisions with common defaults and the existing
# stacks observed on the target VPS (amorevet on :3003, wp80 on :8080).
# ──────────────────────────────────────────────────────────────────────────

name: muusic

services:
  postgres:
    image: postgres:16-alpine
    container_name: muusic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-muusic}
      POSTGRES_USER: ${POSTGRES_USER:-muusic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-muusic} -d ${POSTGRES_DB:-muusic}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    # CI/CD: GitHub Actions pushes ghcr.io/<owner>/muusicmvp-web:latest
    # to GHCR on every push to main. The VPS does `docker compose pull
    # web` to grab the new image, then `up -d` to swap containers.
    #
    # `build:` is kept as a fallback so local devs (and the VPS in
    # emergencies) can still build from source via
    # `docker compose up -d --build web`.
    image: ${WEB_IMAGE:-ghcr.io/baxhix/muusicmvp-web:latest}
    pull_policy: missing
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN}
    container_name: muusic_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:?APP_URL is required}
      DATABASE_URL: postgres://${POSTGRES_USER:-muusic}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-muusic}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      # Secret compartilhado pros endpoints de cron (manager report,
      # daily digest, etc) — server compara Authorization Bearer ===
      # CRON_SECRET. Não tem `:?` porque cron pode ficar opcional
      # em dev (rotas só checam quando o valor está setado).
      CRON_SECRET: ${CRON_SECRET}
      EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM is required}
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:?MAPBOX_TOKEN is required}
      NEXT_PUBLIC_SOCKET_URL: ${SOCKET_URL:-${APP_URL}}
      AVATARS_DIR: /app/uploads/avatars
      REPORTS_DIR: /app/uploads/reports
      GROUPS_DIR: /app/uploads/groups
      FEED_DIR: /app/uploads/feed
      # Materiais — acervo de conteúdo exclusivo (admin upload).
      # Persiste no volume `uploads` junto com o resto; backup
      # único captura tudo. Default do storage.ts coincide com
      # esse path, mas declarar aqui torna explícito.
      MATERIAIS_DIR: /app/uploads/materiais
      # Chat — imagens anexadas a mensagens (DMs + grupos).
      # Mesmo volume `uploads`, subdir dedicada pra GC fácil.
      CHAT_UPLOADS_DIR: /app/uploads/chat
    volumes:
      # Avatar + report-evidence uploads persist across container
      # rebuilds. Both directories live under the same `uploads`
      # volume so a single backup/restore captures everything.
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      postgres:
        condition: service_healthy

  socket:
    image: ${SOCKET_IMAGE:-ghcr.io/baxhix/muusicmvp-socket:latest}
    pull_policy: missing
    build:
      context: .
      dockerfile: Dockerfile.socket
    container_name: muusic_socket
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL}
      DATABASE_URL: postgres://${POSTGRES_USER:-muusic}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-muusic}
      AUTH_SECRET: ${AUTH_SECRET}
      # Required by env validation but unused by the realtime process.
      RESEND_API_KEY: ${RESEND_API_KEY}
      # Mesmo motivo: env validation no socket carrega o schema do
      # web. CRON_SECRET fica disponível mas o socket não atende
      # rotas de cron.
      CRON_SECRET: ${CRON_SECRET}
      EMAIL_FROM: ${EMAIL_FROM}
      MAPBOX_TOKEN: ${MAPBOX_TOKEN}
      SOCKET_PORT: 3002
    ports:
      - "127.0.0.1:3012:3002"
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    image: ${ADMIN_IMAGE:-ghcr.io/baxhix/muusicmvp-admin:latest}
    pull_policy: missing
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        # Inlined into the admin client bundle at build time so the
        # AdminAuthGate can call https://muusic.live/api/auth/me with
        # credentials.
        NEXT_PUBLIC_API_BASE_URL: ${APP_URL}
    container_name: muusic_admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3011:3001"

volumes:
  postgres_data:
  uploads:
