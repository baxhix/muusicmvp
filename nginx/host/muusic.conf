# ──────────────────────────────────────────────────────────────────────────
# muusic — host nginx config (NOT the in-container nginx)
#
# Drop into the VPS where the host nginx is already serving other projects.
# Two server blocks per site (HTTP + HTTPS) so we can issue Let's Encrypt
# certs via the webroot challenge without touching :80 of the host.
#
# Install path on Ubuntu/Debian:
#   sudo cp nginx/host/muusic.conf /etc/nginx/sites-available/muusic
#   sudo ln -sf /etc/nginx/sites-available/muusic /etc/nginx/sites-enabled/muusic
#   sudo mkdir -p /var/www/certbot
#   sudo nginx -t && sudo systemctl reload nginx
# ──────────────────────────────────────────────────────────────────────────

# ── Upstreams point at the docker-compose loopback ports ─────────────────
upstream muusic_web    { server 127.0.0.1:3010; keepalive 32; }
upstream muusic_socket { server 127.0.0.1:3012; keepalive 32; }
upstream muusic_admin  { server 127.0.0.1:3011; keepalive 32; }

# ── HTTP: ACME challenge + redirect to HTTPS ─────────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name muusic.live www.muusic.live admin.muusic.live;

  # certbot --webroot uses this directory.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ── HTTPS: muusic.live + www ─────────────────────────────────────────────
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name muusic.live www.muusic.live;

  ssl_certificate     /etc/letsencrypt/live/muusic.live/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/muusic.live/privkey.pem;

  # Stronger TLS (Mozilla intermediate)
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:muusic_ssl:10m;
  ssl_session_timeout 1d;

  client_max_body_size 10m;

  # ── Socket.IO (websocket upgrade to the realtime container) ──────────
  location /socket.io/ {
    proxy_pass         http://muusic_socket;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
  }

  # ── Next.js (everything else) ────────────────────────────────────────
  location / {
    proxy_pass         http://muusic_web;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }
}

# ── HTTPS: admin.muusic.live ─────────────────────────────────────────────
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name admin.muusic.live;

  ssl_certificate     /etc/letsencrypt/live/muusic.live/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/muusic.live/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:muusic_ssl:10m;
  ssl_session_timeout 1d;

  location / {
    proxy_pass         http://muusic_admin;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }
}
