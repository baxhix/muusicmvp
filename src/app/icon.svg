<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Favicon do Fanverse — o orbe (FanverseCore) recriado como SVG e
    ARREDONDADO (rect rx=16). Convenção de arquivo do App Router:
    src/app/icon.svg vira automaticamente o <link rel="icon">.
    Pra usar o PNG exato, basta trocar este arquivo por src/app/icon.png.
  -->
  <defs>
    <radialGradient id="fvBg" cx="50%" cy="40%" r="72%">
      <stop offset="0%" stop-color="#241038" />
      <stop offset="60%" stop-color="#0d0a18" />
      <stop offset="100%" stop-color="#050509" />
    </radialGradient>
    <radialGradient id="fvGlow" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#fdeaff" />
      <stop offset="18%" stop-color="#f4a6ff" />
      <stop offset="40%" stop-color="#cf5ae6" />
      <stop offset="64%" stop-color="#8a35c4" />
      <stop offset="88%" stop-color="#3f1d6e" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#2a1550" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Base escura com cantos arredondados -->
  <rect width="64" height="64" rx="16" fill="url(#fvBg)" />
  <!-- Glow do orbe (núcleo claro levemente acima do centro) -->
  <ellipse cx="32" cy="28" rx="22" ry="26" fill="url(#fvGlow)" />
</svg>
