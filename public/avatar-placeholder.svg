       The shoulders curve up so when the SVG is clipped to a
       circle (as it is in every avatar slot we use), the body
       reaches the bottom edge cleanly without a flat band. -->
  <circle cx="32" cy="26" r="10" fill="url(#fg)"/>
  <path d="M12 60c0-10 9-17 20-17s20 7 20 17v4H12z" fill="url(#fg)"/>
