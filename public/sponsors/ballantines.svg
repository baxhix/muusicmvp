<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" preserveAspectRatio="xMidYMid meet">
  <!-- Ballantine's — placeholder fiel ao logo enviado pelo product
       (italic script white). Usa fallback chain de scripts cursivos
       disponíveis nos sistemas: Snell Roundhand (macOS), Edwardian
       Script (Windows), Lucida Handwriting, depois cursive genérico.
       Substituir por SVG oficial mantendo este path. -->
  <text
    x="140"
    y="56"
    font-family="'Snell Roundhand', 'Edwardian Script ITC', 'Lucida Handwriting', 'Apple Chancery', cursive"
    font-size="58"
    font-style="italic"
    font-weight="700"
    fill="#FFFFFF"
    text-anchor="middle"
  >Ballantine's</text>
</svg>
