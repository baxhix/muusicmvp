<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 96" preserveAspectRatio="xMidYMid meet">
  <!-- Brahma — placeholder fiel ao logo enviado pelo product (red bg
       + BRAHMA branco em sans condensado italic). Substituir por SVG
       oficial quando disponível mantendo este path. -->
  <rect width="240" height="96" fill="#E20613" />
  <text
    x="120"
    y="70"
    font-family="Impact, 'Anton', 'Oswald', 'Arial Black', sans-serif"
    font-size="62"
    font-weight="900"
    font-style="italic"
    fill="#FFFFFF"
    text-anchor="middle"
    letter-spacing="-1"
    textLength="200"
    lengthAdjust="spacingAndGlyphs"
  >BRAHMA</text>
</svg>
